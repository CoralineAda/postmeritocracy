languageCode = "es"

[Languages.fr]
languageName = "Français"
languageCode = "fr"

[Languages.hi]
languageName = "हिंदी"
languageCode = "hi"

[Languages.it]
languageName = "Italiano"
languageCode = "it"

[Languages.nl]

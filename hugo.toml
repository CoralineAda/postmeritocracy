baseURL = "https://postmeritocracy.org"
languageCode = "en-us"
title = "Post-Meritocracy Manifesto"
disableKinds = ["RSS"]

DefaultContentLanguage = "en"
hasCJKLanguage = true
uglyURLs = false
EnableMissingTranslationPlaceholders = true

[outputs]
home = ["html"]
page = ["html"]

[markup.goldmark.renderer]
unsafe = true

